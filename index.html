<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Solo Leveling System AI</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:black;
        color:#00aaff;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        overflow:hidden;
    }

    .system{
        width:90%;
        max-width:900px;
        height:90vh;
        border:2px solid #00aaff;
        background:rgba(0,0,0,0.95);
        box-shadow:0 0 30px #00aaff;
        display:flex;
        flex-direction:column;
    }

    .header{
        padding:15px;
        border-bottom:1px solid #00aaff;
        font-size:22px;
        letter-spacing:2px;
        text-align:center;
        font-weight:bold;
    }

    .chat{
        flex:1;
        padding:20px;
        overflow-y:auto;
    }

    .msg{
        margin-bottom:15px;
        line-height:1.5;
    }

    .system-msg{
        color:#00e5ff;
    }

    .user-msg{
        color:white;
        text-align:right;
    }

    .input-area{
        display:flex;
        border-top:1px solid #00aaff;
    }

    input{
        flex:1;
        padding:15px;
        background:black;
        color:white;
        border:none;
        outline:none;
        font-size:16px;
    }

    button{
        width:120px;
        border:none;
        background:#00aaff;
        color:black;
        font-weight:bold;
        cursor:pointer;
        transition:0.2s;
    }

    button:hover{
        background:white;
    }

    .status{
        color:#00ff99;
        font-size:14px;
        padding:5px 15px;
        border-bottom:1px solid #003344;
    }
</style>
</head>
<body>

<div class="system">

    <div class="header">
        SYSTEM
    </div>

    <div class="status">
        [ IA ONLINE ]
    </div>

    <div class="chat" id="chat">

        <div class="msg system-msg">
            ▶ Sistema iniciado.
        </div>

        <div class="msg system-msg">
            ▶ Digite um comando.
        </div>

    </div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Digite um comando...">
        <button onclick="sendMessage()">EXECUTAR</button>
    </div>

</div>

<script>

const chat = document.getElementById("chat");

const memory = {
    level: 1,
    xp: 0,
    strength: 5,
    agility: 5,
    intelligence: 5,
    title: "Jogador"
};

function systemReply(text){
    const div = document.createElement("div");
    div.className = "msg system-msg";
    div.innerHTML = "▶ " + text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function userReply(text){
    const div = document.createElement("div");
    div.className = "msg user-msg";
    div.innerHTML = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function levelUp(){
    memory.level++;
    memory.strength += 2;
    memory.agility += 2;
    memory.intelligence += 2;

    systemReply(`
        LEVEL UP<br>
        Nível: ${memory.level}<br>
        FOR: ${memory.strength}<br>
        AGI: ${memory.agility}<br>
        INT: ${memory.intelligence}
    `);
}

function AI(command){

    command = command.toLowerCase();

    // STATUS
    if(command.includes("status")){
        return `
        STATUS DO JOGADOR<br><br>

        Título: ${memory.title}<br>
        Nível: ${memory.level}<br>
        XP: ${memory.xp}<br>
        FOR: ${memory.strength}<br>
        AGI: ${memory.agility}<br>
        INT: ${memory.intelligence}
        `;
    }

    // TREINO
    if(command.includes("treinar")){
        memory.xp += 20;

        if(memory.xp >= 100){
            memory.xp = 0;
            levelUp();
        }

        return "Treino concluído. XP +20";
    }

    // MISSÃO
    if(command.includes("missão")){
        const missions = [
            "Elimine 10 inimigos.",
            "Sobreviva por 3 minutos.",
            "Derrote o chefe.",
            "Entre na dungeon.",
            "Colete 5 núcleos mágicos."
        ];

        return "Nova missão: " +
            missions[Math.floor(Math.random() * missions.length)];
    }

    // SOMBRA
    if(command.includes("extrair sombra")){
        return "Extração concluída.";
    }

    // EVOLUÇÃO
    if(command.includes("evoluir")){
        levelUp();
        return "Evolução forçada executada.";
    }

    // INTELIGÊNCIA SIMULADA
    if(command.includes("quem é o mais forte")){
        return "Aquele que continua evoluindo.";
    }

    if(command.includes("medo")){
        return "Medo aumenta sobrevivência.";
    }

    if(command.includes("morte")){
        return "Morte detectada. Objetivo: evitar.";
    }

    // DEFAULT
    const respostas = [
        "Comando aceito.",
        "Analisando.",
        "Objetivo detectado.",
        "Execução iniciada.",
        "Você está ficando mais forte.",
        "Sistema observando.",
        "Ação registrada.",
        "Dados atualizados."
    ];

    return respostas[Math.floor(Math.random() * respostas.length)];
}

function sendMessage(){

    const input = document.getElementById("input");

    const text = input.value.trim();

    if(text === "") return;

    userReply(text);

    setTimeout(() => {
        const response = AI(text);
        systemReply(response);
    }, 400);

    input.value = "";
}

document.getElementById("input")
.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        sendMessage();
    }
});

</script>

</body>
</html>
